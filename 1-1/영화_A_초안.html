<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영화 티어리스트</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1d2029;
    --line: #333949;
    --text: #f1f3f8;
    --muted: #9aa1b2;
    --accent: #4ade80;
    --danger: #f87171;
    --hover: #2a3040;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { margin: 0 0 20px; font-size: 28px; }

  .add-form { display: flex; gap: 8px; margin-bottom: 24px; }
  .add-form input {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    font-size: 16px;
  }
  .add-form input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .add-form button {
    padding: 11px 20px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #062010;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .tier-row {
    display: flex;
    margin-bottom: 8px;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--panel);
  }
  .tier-label {
    flex: 0 0 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
    color: #14161c;
  }
  .tier-S .tier-label { background: #f87171; }
  .tier-A .tier-label { background: #fb923c; }
  .tier-B .tier-label { background: #facc15; }
  .tier-C .tier-label { background: #4ade80; }
  .tier-D .tier-label { background: #60a5fa; }

  .drop-zone {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 8px;
    min-height: 68px;
    padding: 8px;
  }
  .drop-zone.over { background: var(--hover); outline: 2px dashed var(--accent); outline-offset: -4px; }

  .pool-title { margin: 28px 0 8px; font-size: 18px; color: var(--muted); }
  .pool {
    border: 1px dashed var(--line);
    border-radius: 10px;
    background: var(--panel);
  }

  .card {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 8px 8px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #2a3040;
    cursor: grab;
    user-select: none;
  }
  .card.dragging { opacity: 0.4; }
  .card .del {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .card .del:hover { color: var(--danger); background: rgba(248, 113, 113, 0.15); }
  .hint { margin-top: 24px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>영화 티어리스트</h1>

  <form class="add-form" id="addForm">
    <input id="titleInput" type="text" placeholder="영화 제목을 입력하세요" maxlength="60" autocomplete="off">
    <button type="submit">추가</button>
  </form>

  <div id="tiers"></div>

  <h2 class="pool-title">미분류</h2>
  <div class="pool drop-zone" id="pool" data-tier="none"></div>

  <p class="hint">영화 카드를 끌어서 원하는 칸에 놓아 보세요. 배치는 자동으로 저장돼요.</p>
</div>

<script>
(function () {
  var TIERS = ["S", "A", "B", "C", "D"];
  var STORAGE_KEY = "movieTierList";
  var movies = load();
  var dragId = null;

  function load() {
    try {
      var data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(data)) {
        return data.filter(function (m) {
          return m && typeof m.id === "string" && typeof m.title === "string";
        });
      }
    } catch (e) {}
    return [];
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
    } catch (e) {}
  }

  function newId() {
    return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function makeCard(movie) {
    var card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    card.dataset.id = movie.id;

    var name = document.createElement("span");
    name.textContent = movie.title;

    var del = document.createElement("button");
    del.type = "button";
    del.className = "del";
    del.title = "삭제";
    del.setAttribute("aria-label", movie.title + " 삭제");
    del.textContent = "✕";
    del.addEventListener("click", function () {
      movies = movies.filter(function (m) { return m.id !== movie.id; });
      save();
      render();
    });

    card.addEventListener("dragstart", function (e) {
      dragId = movie.id;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", movie.id);
    });
    card.addEventListener("dragend", function () {
      dragId = null;
      card.classList.remove("dragging");
    });

    card.appendChild(name);
    card.appendChild(del);
    return card;
  }

  function setupZone(zone) {
    zone.addEventListener("dragover", function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      zone.classList.add("over");
    });
    zone.addEventListener("dragleave", function (e) {
      if (!zone.contains(e.relatedTarget)) zone.classList.remove("over");
    });
    zone.addEventListener("drop", function (e) {
      e.preventDefault();
      zone.classList.remove("over");
      var id = dragId || e.dataTransfer.getData("text/plain");
      var movie = movies.find(function (m) { return m.id === id; });
      if (!movie) return;
      movie.tier = zone.dataset.tier;
      save();
      render();
    });
  }

  function render() {
    document.querySelectorAll(".drop-zone").forEach(function (zone) {
      zone.querySelectorAll(".card").forEach(function (c) { c.remove(); });
    });
    movies.forEach(function (movie) {
      var tier = TIERS.indexOf(movie.tier) >= 0 ? movie.tier : "none";
      var zone = document.querySelector('.drop-zone[data-tier="' + tier + '"]');
      zone.appendChild(makeCard(movie));
    });
  }

  function build() {
    var tiersBox = document.getElementById("tiers");
    TIERS.forEach(function (t) {
      var row = document.createElement("div");
      row.className = "tier-row tier-" + t;
      var label = document.createElement("div");
      label.className = "tier-label";
      label.textContent = t;
      var zone = document.createElement("div");
      zone.className = "drop-zone";
      zone.dataset.tier = t;
      row.appendChild(label);
      row.appendChild(zone);
      tiersBox.appendChild(row);
    });
    document.querySelectorAll(".drop-zone").forEach(setupZone);
  }

  document.getElementById("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("titleInput");
    var title = input.value.trim();
    if (!title) { input.focus(); return; }
    movies.push({ id: newId(), title: title, tier: "none" });
    save();
    render();
    input.value = "";
    input.focus();
  });

  build();
  render();
})();
</script>
</body>
</html>
