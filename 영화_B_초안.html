<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영화 티어리스트</title>
<style>
  :root {
    --bg: #f6f3ee;
    --paper: #ffffff;
    --line: #e1dbd0;
    --text: #2b2620;
    --muted: #8a8174;
    --accent: #3b5bdb;
    --danger: #d6336c;
    --over: #eef2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { margin: 0 0 24px; font-size: 30px; text-align: center; letter-spacing: -0.5px; }

  .add-form { display: flex; gap: 8px; margin-bottom: 28px; }
  .add-form input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    color: var(--text);
    font-size: 16px;
  }
  .add-form input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .add-form button {
    padding: 12px 22px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .add-form button:hover { filter: brightness(1.1); }

  .tier-row {
    display: flex;
    margin-bottom: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--paper);
  }
  .tier-label {
    flex: 0 0 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 800;
    color: #fff;
  }
  .tier-S .tier-label { background: #e03131; }
  .tier-A .tier-label { background: #f08c00; }
  .tier-B .tier-label { background: #2f9e44; }
  .tier-C .tier-label { background: #1c7ed6; }
  .tier-D .tier-label { background: #7048e8; }

  .zone {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 8px;
    min-height: 64px;
    padding: 8px;
  }
  .zone.over { background: var(--over); box-shadow: inset 0 0 0 2px var(--accent); }

  .pool-wrap { margin-top: 28px; }
  .pool-wrap h2 { margin: 0 0 8px; font-size: 16px; color: var(--muted); }
  .pool-wrap .zone {
    border: 2px dashed var(--line);
    border-radius: 8px;
    background: var(--paper);
    min-height: 72px;
  }
  .pool-wrap .zone.over { background: var(--over); border-color: var(--accent); box-shadow: none; }

  .card {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 6px 7px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fbf9f5;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    cursor: grab;
    user-select: none;
    font-size: 15px;
  }
  .card.dragging { opacity: 0.35; }
  .card button {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 4px;
    cursor: pointer;
  }
  .card button:hover { color: var(--danger); background: #fff0f6; }

  .hint { margin-top: 24px; font-size: 14px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>영화 티어리스트</h1>

  <form class="add-form" id="addForm">
    <input id="titleInput" type="text" placeholder="영화 제목을 입력하세요" maxlength="60" autocomplete="off">
    <button type="submit">추가</button>
  </form>

  <div id="tiers"></div>

  <div class="pool-wrap">
    <h2>미분류</h2>
    <div class="zone" data-tier="none"></div>
  </div>

  <p class="hint">카드를 끌어서 원하는 칸에 놓으세요. 변경 내용은 자동으로 저장돼요.</p>
</div>

<script>
(function () {
  var TIERS = ["S", "A", "B", "C", "D"];
  var KEY = "movieTierList_v1";
  var movies = load();
  var dragId = null;

  function load() {
    try {
      var data = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(data)) {
        return data.filter(function (m) {
          return m && typeof m.id === "string" && typeof m.title === "string";
        });
      }
    } catch (e) {}
    return [];
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(movies)); } catch (e) {}
  }

  function newId() {
    return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function makeCard(movie) {
    var card = document.createElement("div");
    card.className = "card";
    card.draggable = true;

    var label = document.createElement("span");
    label.textContent = movie.title;

    var del = document.createElement("button");
    del.type = "button";
    del.textContent = "✕";
    del.title = "삭제";
    del.setAttribute("aria-label", movie.title + " 삭제");
    del.addEventListener("click", function () {
      movies = movies.filter(function (m) { return m.id !== movie.id; });
      save();
      render();
    });

    card.addEventListener("dragstart", function (e) {
      dragId = movie.id;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", movie.id);
      setTimeout(function () { card.classList.add("dragging"); }, 0);
    });
    card.addEventListener("dragend", function () {
      dragId = null;
      card.classList.remove("dragging");
      document.querySelectorAll(".zone.over").forEach(function (z) { z.classList.remove("over"); });
    });

    card.appendChild(label);
    card.appendChild(del);
    return card;
  }

  function setupZone(zone) {
    zone.addEventListener("dragover", function (e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      zone.classList.add("over");
    });
    zone.addEventListener("dragleave", function (e) {
      if (!zone.contains(e.relatedTarget)) zone.classList.remove("over");
    });
    zone.addEventListener("drop", function (e) {
      e.preventDefault();
      zone.classList.remove("over");
      var id = dragId || e.dataTransfer.getData("text/plain");
      var movie = movies.find(function (m) { return m.id === id; });
      if (!movie || movie.tier === zone.dataset.tier) return;
      movie.tier = zone.dataset.tier;
      save();
      render();
    });
  }

  function render() {
    var zones = {};
    document.querySelectorAll(".zone").forEach(function (z) {
      zones[z.dataset.tier] = z;
      z.textContent = "";
    });
    movies.forEach(function (m) {
      var key = TIERS.indexOf(m.tier) >= 0 ? m.tier : "none";
      zones[key].appendChild(makeCard(m));
    });
  }

  var tiersBox = document.getElementById("tiers");
  TIERS.forEach(function (t) {
    var row = document.createElement("div");
    row.className = "tier-row tier-" + t;
    var label = document.createElement("div");
    label.className = "tier-label";
    label.textContent = t;
    var zone = document.createElement("div");
    zone.className = "zone";
    zone.dataset.tier = t;
    row.appendChild(label);
    row.appendChild(zone);
    tiersBox.appendChild(row);
  });
  document.querySelectorAll(".zone").forEach(setupZone);

  document.getElementById("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("titleInput");
    var title = input.value.trim();
    if (!title) { input.focus(); return; }
    movies.push({ id: newId(), title: title, tier: "none" });
    save();
    render();
    input.value = "";
    input.focus();
  });

  render();
})();
</script>
</body>
</html>
